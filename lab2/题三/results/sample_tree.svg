<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
<title id="title">题三样例：精确Minimax回传与左到右Alpha-Beta剪枝</title>
<desc id="desc">根MAX的真值5；左右MIN真值5和2；四个MAX真值5、9、9、2。左侧第二个MAX在beta为5时看到6即截断，返回下界6，叶9未访问。Alpha-Beta访问14次、评估7叶，完整Minimax访问15次、评估8叶。</desc>
<rect width="1200" height="640" fill="#ffffff"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#24384b">
<text x="30" y="37" font-size="27" fill="#24384b" text-anchor="start" font-weight="bold">题三样例：回传真值与实际剪枝</text>
<text x="30" y="67" font-size="17" fill="#24384b" text-anchor="start" font-weight="normal">正式访问顺序：从左到右；层次为 MAX → MIN → MAX → 叶值。</text>
<line x1="600" y1="140" x2="310" y2="186" stroke="#9aa9b8" stroke-width="2.2"/>
<line x1="600" y1="140" x2="890" y2="186" stroke="#9aa9b8" stroke-width="2.2"/>
<line x1="310" y1="246" x2="165" y2="300" stroke="#9aa9b8" stroke-width="2.2"/>
<line x1="310" y1="246" x2="455" y2="300" stroke="#9aa9b8" stroke-width="2.2"/>
<line x1="890" y1="246" x2="745" y2="300" stroke="#9aa9b8" stroke-width="2.2"/>
<line x1="890" y1="246" x2="1035" y2="300" stroke="#9aa9b8" stroke-width="2.2"/>
<line x1="165" y1="360" x2="100" y2="424" stroke="#9aa9b8" stroke-width="2.2"/>
<line x1="165" y1="360" x2="230" y2="424" stroke="#9aa9b8" stroke-width="2.2"/>
<line x1="455" y1="360" x2="390" y2="424" stroke="#9aa9b8" stroke-width="2.2"/>
<line x1="455" y1="360" x2="520" y2="424" stroke="#c64141" stroke-width="2.2" stroke-dasharray="7 5"/>
<line x1="745" y1="360" x2="680" y2="424" stroke="#9aa9b8" stroke-width="2.2"/>
<line x1="745" y1="360" x2="810" y2="424" stroke="#9aa9b8" stroke-width="2.2"/>
<line x1="1035" y1="360" x2="970" y2="424" stroke="#9aa9b8" stroke-width="2.2"/>
<line x1="1035" y1="360" x2="1100" y2="424" stroke="#9aa9b8" stroke-width="2.2"/>
<rect x="529" y="80" width="142" height="60" rx="12" fill="#d9edf5" stroke="#557a94" stroke-width="1.7"/>
<text x="600" y="105" font-size="16" fill="#24384b" text-anchor="middle" font-weight="normal">MAX · 根</text>
<text x="600" y="129" font-size="21" fill="#24384b" text-anchor="middle" font-weight="bold">真值 5</text>
<rect x="239" y="186" width="142" height="60" rx="12" fill="#edf0fb" stroke="#557a94" stroke-width="1.7"/>
<text x="310" y="211" font-size="16" fill="#24384b" text-anchor="middle" font-weight="normal">MIN</text>
<text x="310" y="235" font-size="21" fill="#24384b" text-anchor="middle" font-weight="bold">真值 5</text>
<rect x="819" y="186" width="142" height="60" rx="12" fill="#edf0fb" stroke="#557a94" stroke-width="1.7"/>
<text x="890" y="211" font-size="16" fill="#24384b" text-anchor="middle" font-weight="normal">MIN</text>
<text x="890" y="235" font-size="21" fill="#24384b" text-anchor="middle" font-weight="bold">真值 2</text>
<rect x="94" y="300" width="142" height="60" rx="12" fill="#eaf3f8" stroke="#557a94" stroke-width="1.7"/>
<text x="165" y="325" font-size="16" fill="#24384b" text-anchor="middle" font-weight="normal">MAX</text>
<text x="165" y="349" font-size="21" fill="#24384b" text-anchor="middle" font-weight="bold">真值 5</text>
<rect x="344" y="300" width="222" height="60" rx="12" fill="#fff1df" stroke="#557a94" stroke-width="1.7"/>
<text x="455" y="325" font-size="16" fill="#24384b" text-anchor="middle" font-weight="normal">MAX · β=5 时截断</text>
<text x="455" y="349" font-size="21" fill="#24384b" text-anchor="middle" font-weight="bold">真值 9</text>
<rect x="674" y="300" width="142" height="60" rx="12" fill="#eaf3f8" stroke="#557a94" stroke-width="1.7"/>
<text x="745" y="325" font-size="16" fill="#24384b" text-anchor="middle" font-weight="normal">MAX</text>
<text x="745" y="349" font-size="21" fill="#24384b" text-anchor="middle" font-weight="bold">真值 9</text>
<rect x="964" y="300" width="142" height="60" rx="12" fill="#eaf3f8" stroke="#557a94" stroke-width="1.7"/>
<text x="1035" y="325" font-size="16" fill="#24384b" text-anchor="middle" font-weight="normal">MAX</text>
<text x="1035" y="349" font-size="21" fill="#24384b" text-anchor="middle" font-weight="bold">真值 2</text>
<rect x="333" y="367" width="244" height="26" rx="4" fill="#ffffff"/>
<text x="455" y="387" font-size="16" fill="#9a5f17" text-anchor="middle" font-weight="normal">截断返回 6，是下界（≥6）</text>
<circle cx="100" cy="447" r="24" fill="#f4f8fb" stroke="#557a94" stroke-width="2"/>
<text x="100" y="455" font-size="23" fill="#557a94" text-anchor="middle" font-weight="bold">3</text>
<circle cx="230" cy="447" r="24" fill="#f4f8fb" stroke="#557a94" stroke-width="2"/>
<text x="230" y="455" font-size="23" fill="#557a94" text-anchor="middle" font-weight="bold">5</text>
<circle cx="390" cy="447" r="24" fill="#f4f8fb" stroke="#557a94" stroke-width="2"/>
<text x="390" y="455" font-size="23" fill="#557a94" text-anchor="middle" font-weight="bold">6</text>
<circle cx="520" cy="447" r="24" fill="#fff5f5" stroke="#c64141" stroke-width="2" stroke-dasharray="6 4"/>
<text x="520" y="455" font-size="23" fill="#c64141" text-anchor="middle" font-weight="bold">9</text>
<text x="520" y="499" font-size="16" fill="#c64141" text-anchor="middle" font-weight="normal">未访问</text>
<circle cx="680" cy="447" r="24" fill="#f4f8fb" stroke="#557a94" stroke-width="2"/>
<text x="680" y="455" font-size="23" fill="#557a94" text-anchor="middle" font-weight="bold">6</text>
<circle cx="810" cy="447" r="24" fill="#f4f8fb" stroke="#557a94" stroke-width="2"/>
<text x="810" y="455" font-size="23" fill="#557a94" text-anchor="middle" font-weight="bold">9</text>
<circle cx="970" cy="447" r="24" fill="#f4f8fb" stroke="#557a94" stroke-width="2"/>
<text x="970" y="455" font-size="23" fill="#557a94" text-anchor="middle" font-weight="bold">1</text>
<circle cx="1100" cy="447" r="24" fill="#f4f8fb" stroke="#557a94" stroke-width="2"/>
<text x="1100" y="455" font-size="23" fill="#557a94" text-anchor="middle" font-weight="bold">2</text>
<rect x="30" y="529" width="1140" height="90" rx="10" fill="#f0f5f8"/>
<text x="50" y="558" font-size="18" fill="#24384b" text-anchor="start" font-weight="normal">完整 Minimax：15 次节点访问 / 8 次叶评估；Alpha-Beta：14 / 7；根值均为 5。</text>
<text x="50" y="586" font-size="17" fill="#24384b" text-anchor="start" font-weight="normal">真正节省工作的剪枝 1 次；右 MIN 最后一个孩子回传后虽 α≥β，但已无剩余孩子可省。</text>
<text x="50" y="608" font-size="15" fill="#607487" text-anchor="start" font-weight="normal">图中“真值”由完整 Minimax 得到；截断返回的界不能当作该子树的精确值。</text>
</g>
</svg>