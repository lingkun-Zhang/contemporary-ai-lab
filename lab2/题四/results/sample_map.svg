<text x="76" y="689" font-size="15" fill="#2c4050" text-anchor="start">起点不收费；每次移动按进入格收费。</text>
<text x="76" y="716" font-size="15" fill="#2c4050" text-anchor="start">获得宝藏后只更新行动玩家的位置。</text>
<rect x="655" y="120" width="515" height="164" rx="8" fill="#f3f7fa"/>
<text x="675" y="147" font-size="18" fill="#2c4050" text-anchor="start" font-weight="bold">H=2：按最优延续的一条路径</text>
<text x="675" y="181" font-size="15" fill="#2c4050" text-anchor="start">1. A：A → T2</text>
<text x="695" y="202" font-size="14" fill="#536b80" text-anchor="start">费用4，收益2；A=2，B=0，U=2</text>
<text x="675" y="227" font-size="15" fill="#2c4050" text-anchor="start">2. B：B → T3</text>
<text x="695" y="248" font-size="14" fill="#536b80" text-anchor="start">费用4，收益3；A=2，B=3，U=-1</text>
<text x="675" y="278" font-size="17" fill="#2c4050" text-anchor="start" font-weight="bold">最终收益差 U=-1</text>
<rect x="655" y="338" width="515" height="256" rx="8" fill="#f3f7fa"/>
<text x="675" y="365" font-size="18" fill="#2c4050" text-anchor="start" font-weight="bold">H=4：按最优延续的一条路径</text>
<text x="675" y="399" font-size="15" fill="#2c4050" text-anchor="start">1. A：A → T3</text>
<text x="695" y="420" font-size="14" fill="#536b80" text-anchor="start">费用8，收益-1；A=-1，B=0，U=-1</text>
<text x="675" y="445" font-size="15" fill="#2c4050" text-anchor="start">2. B：B → T1</text>
<text x="695" y="466" font-size="14" fill="#536b80" text-anchor="start">费用8，收益1；A=-1，B=1，U=-2</text>
<text x="675" y="491" font-size="15" fill="#2c4050" text-anchor="start">3. A：T3 → T2</text>
<text x="695" y="512" font-size="14" fill="#536b80" text-anchor="start">费用6，收益0；A=-1，B=1，U=-2</text>
<text x="675" y="537" font-size="15" fill="#2c4050" text-anchor="start">4. B：T1 → T4</text>
<text x="695" y="558" font-size="14" fill="#536b80" text-anchor="start">费用12，收益-5；A=-1，B=-4，U=3</text>
<text x="675" y="588" font-size="17" fill="#2c4050" text-anchor="start" font-weight="bold">最终收益差 U=3</text>
<text x="675" y="680" font-size="15" fill="#2c4050" text-anchor="start">H按单次行动计：A → B → A → B。</text>
<text x="675" y="709" font-size="15" fill="#2c4050" text-anchor="start">收益为负仍须选择剩余宝藏，不能跳过。</text>
<text x="28" y="809" font-size="13" fill="#62798c" text-anchor="start">图示来自已保存样例分析；同分路径可以有多条，此处仅展示记录的一条。</text>
