<text x="100" y="720" font-size="15" fill="#2c4050" text-anchor="start">H2只评估双方各一次行动；H4将第二次移动及其可能的负收益纳入回传。</text>
<text x="100" y="752" font-size="14" fill="#536b80" text-anchor="start">不同深度使用不同截断位置，根值无需单调；同一深度的Minimax与Alpha-Beta应一致。</text>
