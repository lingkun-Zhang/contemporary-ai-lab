<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="440" viewBox="0 0 1100 440" role="img" aria-label="按地图配对的节点收益：探索性 95% bootstrap 区间">
<style>text{font-family:'Microsoft YaHei', 'Noto Sans CJK SC', Arial, sans-serif;fill:#263746} .title{font-size:22px;font-weight:700}.label{font-size:14px}.note{font-size:12px;fill:#536575}</style>
<rect width="1100" height="440" fill="#ffffff"/>
<text class="title" x="24" y="34">按地图配对的节点收益：探索性 95% bootstrap 区间</text>
<text class="note" x="24" y="60">40×40；曼哈顿 low_h 相对 h=0；少于 5 张不同地图时不计算区间。</text>
<line x1="100" y1="340.0" x2="1020" y2="340.0" stroke="#e1e7ec"/>
<text class="note" x="88" y="344.0" text-anchor="end">0%</text>
