<circle cx="560.0" cy="135.0476947535771" r="5" fill="#d78a32"/>
<text class="label" x="744.0" y="366" text-anchor="middle">p=0.3</text>
<text class="note" x="744.0" y="388" text-anchor="middle">不同地图 n=9</text>
<line x1="744.0" y1="161.66666666666666" x2="744.0" y2="239.60644007155636" stroke="#2b857c" stroke-width="3"/>
