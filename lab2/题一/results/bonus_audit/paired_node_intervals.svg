<text class="note" x="88" y="286.5" text-anchor="end">25%</text>
<line x1="100" y1="225.0" x2="1020" y2="225.0" stroke="#e1e7ec"/>
<text class="note" x="88" y="229.0" text-anchor="end">50%</text>
<line x1="100" y1="167.5" x2="1020" y2="167.5" stroke="#e1e7ec"/>
<text class="note" x="88" y="171.5" text-anchor="end">75%</text>
<line x1="100" y1="110.0" x2="1020" y2="110.0" stroke="#e1e7ec"/>
<text class="note" x="88" y="114.0" text-anchor="end">100%</text>
<text class="label" x="192.0" y="366" text-anchor="middle">p=0</text>
<text class="note" x="192.0" y="388" text-anchor="middle">不同地图 n=1</text>
<text class="note" x="192.0" y="225.0" text-anchor="middle">区间不计算</text>
<text class="label" x="376.0" y="366" text-anchor="middle">p=0.1</text>
<text class="note" x="376.0" y="388" text-anchor="middle">不同地图 n=20</text>
<line x1="376.0" y1="128.34199547455822" x2="376.0" y2="138.30824296985338" stroke="#2b857c" stroke-width="3"/>
<line x1="368.0" y1="128.34199547455822" x2="384.0" y2="128.34199547455822" stroke="#2b857c" stroke-width="2"/>
<line x1="368.0" y1="138.30824296985338" x2="384.0" y2="138.30824296985338" stroke="#2b857c" stroke-width="2"/>
<circle cx="376.0" cy="135.2149124183827" r="5" fill="#d78a32"/>
<text class="label" x="560.0" y="366" text-anchor="middle">p=0.2</text>
<text class="note" x="560.0" y="388" text-anchor="middle">不同地图 n=19</text>
<line x1="560.0" y1="133.39285714285717" x2="560.0" y2="138.90710382513663" stroke="#2b857c" stroke-width="3"/>
<line x1="552.0" y1="133.39285714285717" x2="568.0" y2="133.39285714285717" stroke="#2b857c" stroke-width="2"/>
