<text class="label" x="928.0" y="366" text-anchor="middle">p=0.4</text>
<text class="note" x="928.0" y="388" text-anchor="middle">不同地图 n=1</text>
<text class="note" x="928.0" y="225.0" text-anchor="middle">区间不计算</text>
<text class="note" x="24" y="420">点为逐图减少率的中位数；区间不代表个体地图取值范围，也不保证其他地图或机器上的收益。</text>
</svg>