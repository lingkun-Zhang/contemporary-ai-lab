<svg xmlns="http://www.w3.org/2000/svg" width="750" height="301" viewBox="0 0 750 301">
<style>text{font-family:'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif;fill:#273b49}.title{font-size:22px;font-weight:700}.label{font-size:14px}.note{font-size:12px;fill:#526777}</style>
<rect width="750" height="301" fill="white"/>
<text class="title" x="24" y="34">零权拓展：原始曼哈顿可以失去费用最优性</text>
<text class="note" x="24" y="60">这不是 PDF 正权样例；低代价绕行被几何步数高估。</text>
<text class="label" x="24" y="86">安全修正启发：费用 0，步数 4</text>
<rect x="24" y="124" width="48" height="48" fill="#f8dba9" stroke="#d3dde4"/>
<text x="48.0" y="155.2" text-anchor="middle" style="font-size:14px">S</text>
<rect x="72" y="124" width="48" height="48" fill="#f2f6f8" stroke="#d3dde4"/>
<text x="96.0" y="155.2" text-anchor="middle" style="font-size:14px">1</text>
<rect x="120" y="124" width="48" height="48" fill="#f8dba9" stroke="#d3dde4"/>
<text x="144.0" y="155.2" text-anchor="middle" style="font-size:14px">E=0</text>
<rect x="24" y="172" width="48" height="48" fill="#f8dba9" stroke="#d3dde4"/>
<text x="48.0" y="203.2" text-anchor="middle" style="font-size:14px">0</text>
<rect x="72" y="172" width="48" height="48" fill="#f8dba9" stroke="#d3dde4"/>
<text x="96.0" y="203.2" text-anchor="middle" style="font-size:14px">0</text>
<rect x="120" y="172" width="48" height="48" fill="#f8dba9" stroke="#d3dde4"/>
<text x="144.0" y="203.2" text-anchor="middle" style="font-size:14px">0</text>
<polyline points="48.0,148.0 48.0,196.0 96.0,196.0 144.0,196.0 144.0,148.0" fill="none" stroke="#be6f1e" stroke-width="2.5" opacity=".65"/>
<text class="label" x="384" y="86">原始曼哈顿：费用 1，步数 2</text>
<rect x="384" y="124" width="48" height="48" fill="#f8dba9" stroke="#d3dde4"/>
<text x="408.0" y="155.2" text-anchor="middle" style="font-size:14px">S</text>
<rect x="432" y="124" width="48" height="48" fill="#f8dba9" stroke="#d3dde4"/>
<text x="456.0" y="155.2" text-anchor="middle" style="font-size:14px">1</text>
<rect x="480" y="124" width="48" height="48" fill="#f8dba9" stroke="#d3dde4"/>
<text x="504.0" y="155.2" text-anchor="middle" style="font-size:14px">E=0</text>
<rect x="384" y="172" width="48" height="48" fill="#f2f6f8" stroke="#d3dde4"/>
<text x="408.0" y="203.2" text-anchor="middle" style="font-size:14px">0</text>
<rect x="432" y="172" width="48" height="48" fill="#f2f6f8" stroke="#d3dde4"/>
<text x="456.0" y="203.2" text-anchor="middle" style="font-size:14px">0</text>
<rect x="480" y="172" width="48" height="48" fill="#f2f6f8" stroke="#d3dde4"/>
<text x="504.0" y="203.2" text-anchor="middle" style="font-size:14px">0</text>
<polyline points="408.0,148.0 456.0,148.0 504.0,148.0" fill="none" stroke="#be6f1e" stroke-width="2.5" opacity=".65"/>
<text class="note" x="24" y="281">S 首次费用为 0；只按进入下一格收费；E 为 0；橙线为返回路径。</text>
</svg>